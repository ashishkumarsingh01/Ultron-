<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultron - AI Agent Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 2px solid #00d4ff;
        }
        
        .logo {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .status {
            font-size: 0.9em;
            color: #00d4ff;
            margin-top: 10px;
        }
        
        .status.online::before {
            content: "● ";
            color: #00ff00;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        
        .card h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .card p {
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        
        input, textarea {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 5px;
            color: #fff;
            font-family: inherit;
        }
        
        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .chat-box {
            height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 5px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            background: rgba(0, 212, 255, 0.2);
            margin-left: 20px;
            border-left: 3px solid #00d4ff;
        }
        
        .message.agent {
            background: rgba(100, 200, 100, 0.2);
            margin-right: 20px;
            border-left: 3px solid #64c864;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .info-item {
            background: rgba(0, 212, 255, 0.1);
            padding: 12px;
            border-radius: 5px;
            text-align: center;
        }
        
        .info-item .label {
            font-size: 0.8em;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .info-item .value {
            font-size: 1.2em;
            color: #00d4ff;
            font-weight: bold;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            opacity: 0.7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">⚡ ULTRON</div>
            <p>Advanced AI Agent Kernel</p>
            <div class="status online">System Online</div>
        </header>
        
        <div class="grid">
            <!-- Chat Panel -->
            <div class="card">
                <h2>💬 Chat</h2>
                <div class="chat-box" id="chatBox"></div>
                <div class="input-group">
                    <input type="text" id="chatInput" placeholder="Ask me anything...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
            
            <!-- Task Panel -->
            <div class="card">
                <h2>📋 Tasks</h2>
                <div class="input-group">
                    <textarea id="taskInput" placeholder="Describe your task..." rows="3"></textarea>
                </div>
                <button onclick="executeTask()" style="width: 100%;">Execute Task</button>
                <div id="taskOutput" style="margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 5px; display: none;">
                    <p><strong>Result:</strong></p>
                    <p id="taskResult"></p>
                </div>
            </div>
        </div>
        
        <!-- Agent Info -->
        <div class="card">
            <h2>ℹ️ Agent Information</h2>
            <div class="info-grid">
                <div class="info-item">
                    <div class="label">Agent Name</div>
                    <div class="value" id="agentName">Ultron</div>
                </div>
                <div class="info-item">
                    <div class="label">LLM Model</div>
                    <div class="value" id="llmModel">-</div>
                </div>
                <div class="info-item">
                    <div class="label">Memory Backend</div>
                    <div class="value" id="memoryBackend">-</div>
                </div>
                <div class="info-item">
                    <div class="label">Status</div>
                    <div class="value" style="color: #00ff00;">Active</div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Ultron Agent Kernel v0.1.0 | Powered by AI | © 2024</p>
        </footer>
    </div>
    
    <script>
        const API_BASE = "http://localhost:8000/api";
        
        // Initialize
        async function initialize() {
            try {
                const response = await fetch(`${API_BASE}/info`);
                const data = await response.json();
                document.getElementById('agentName').textContent = data.name || 'Ultron';
                document.getElementById('llmModel').textContent = data.llm_model || '-';
                document.getElementById('memoryBackend').textContent = data.memory_backend || '-';
            } catch (error) {
                console.error('Failed to load agent info:', error);
            }
        }
        
        // Send chat message
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';
            
            try {
                const response = await fetch(`${API_BASE}/think?prompt=${encodeURIComponent(message)}`, {
                    method: 'POST'
                });
                const data = await response.json();
                addMessage(data.response, 'agent');
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'agent');
            }
        }
        
        // Execute task
        async function executeTask() {
            const input = document.getElementById('taskInput');
            const task = input.value.trim();
            
            if (!task) return;
            
            try {
                const response = await fetch(`${API_BASE}/execute?task=${encodeURIComponent(task)}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                const output = document.getElementById('taskOutput');
                const result = document.getElementById('taskResult');
                result.textContent = data.result || 'Task completed';
                output.style.display = 'block';
            } catch (error) {
                const output = document.getElementById('taskOutput');
                const result = document.getElementById('taskResult');
                result.textContent = `Error: ${error.message}`;
                output.style.display = 'block';
            }
        }
        
        // Add message to chat
        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // Allow Enter key to send message
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            initialize();
        });
    </script>
</body>
</html>
